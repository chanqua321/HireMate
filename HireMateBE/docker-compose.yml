services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Oracle Ampere (ARM) needs amd64 emulation for SQL Server
    platform: linux/amd64
    environment:
      TZ: Asia/Ho_Chi_Minh
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - hiremate_mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  api:
    build: .
    ports:
      - "5080:8080"
    environment:
      TZ: Asia/Ho_Chi_Minh
      ASPNETCORE_ENVIRONMENT: Production
      PORT: "8080"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=HireMateDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: "${JWT_KEY}"
      EmailSettings__ApiPublicUrl: "${API_PUBLIC_URL}"
      EmailSettings__FrontendUrl: "${FRONTEND_URL}"
      Cors__Origins__0: "${CORS_ORIGIN_0}"
      Swagger__Enabled: "false"
      Ai__Provider: "${AI_PROVIDER:-Gemini}"
      Ai__ApiKey: "${AI_API_KEY:-}"
      Ai__Model: "${AI_MODEL:-gemini-2.0-flash}"
      Ai__Enabled: "true"
      VnPay__Enabled: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hiremate_mssql:
